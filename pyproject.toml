[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vroidstudio-mcp"
version = "0.3.1"
description = "VRoid Studio brute-force automation via pywinauto-mcp — 55 archetypes, state machine, verification."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Sandra Schieder" }]
dependencies = [
    "fastapi>=0.115",
    "fastmcp>=3.2",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "starlette>=0.46",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
vroidstudio-mcp = "vroidstudio_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vroidstudio_mcp = ["config/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

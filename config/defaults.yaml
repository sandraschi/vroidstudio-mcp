version: 2
description: VRoid Studio step templates — generated from step_builder.py (shortcut-first)
calibration:
  resolution:
  - 1920
  - 1080
  notes: Clicks only for sample tile and preset thumbnails. All navigation via shortcuts.
templates:
  female_sample_minimal:
    steps:
    - action: launch
      name: launch_vroid
      state: launched
      require_change: false
    - action: focus
      name: focus_window
      state: focused
      require_change: false
    - action: shortcut
      name: new_project
      shortcut: new
      state: new_project
      require_change: false
    - action: wait_stable
      name: new_project_stable
      require_change: false
    - &id001
      action: sample_click
      name: pick_sample
      state: sample_selected
      require_change: true
    - &id002
      action: shortcut
      name: confirm_sample
      shortcut: dialog_ok
      require_change: true
    - &id003
      action: wait_stable
      name: model_ready
      require_change: false
    - action: shortcut
      name: save_project
      shortcut: save
      require_change: false
    - action: wait_stable
      name: save_done
      require_change: false
    - action: shortcut
      name: export_vrm
      shortcut: export_vrm
      state: exporting
      require_change: false
    - action: sleep
      name: export_dialog_wait
      seconds: 5
      require_change: false
    - action: export_dialog
